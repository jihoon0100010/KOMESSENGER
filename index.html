<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KM (KOMESSENGER)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 400px; background: #000; height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .screen { display: flex; flex-direction: column; height: 100%; padding: 24px 20px; text-align: center; justify-content: center; position: absolute; inset: 0; background: #000; z-index: 10; }
    .screen.hidden { display: none !important; }
    
    .km-logo-icon { width: 56px; height: 56px; border-radius: 14px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; letter-spacing: -1px; margin: 0 auto 20px; }
    .header-km-icon { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; }

    .title { font-size: 20px; font-weight: 700; color: #e0e0e0; margin-bottom: 8px; line-height: 1.4; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.5; }
    
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #aaa; margin-bottom: 6px; letter-spacing: 1px; }
    .input-box { width: 100%; height: 46px; background: #262626; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 0 14px; font-size: 14px; outline: none; }
    
    .btn { width: 100%; height: 46px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; margin-top: 8px; }
    .btn-dark { background: #333; color: #fff; }
    
    .header { height: 56px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #000; z-index: 5; }
    .header-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .info-btn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #888; color: #888; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    .content-body { flex: 1; overflow-y: auto; padding-bottom: 60px; }
    .empty-state { text-align: center; color: #666; margin-top: 80px; font-size: 14px; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #181818; gap: 12px; cursor: pointer; text-align: left; position: relative; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #222; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; position: relative; }
    .online-badge { width: 10px; height: 10px; background: #2ed573; border-radius: 50%; border: 2px solid #000; position: absolute; bottom: 0; right: 0; }
    .chat-info { flex: 1; }
    .chat-name { font-size: 15px; font-weight: 600; color: #eee; display: flex; align-items: center; justify-content: space-between; }
    .chat-msg { font-size: 12px; color: #777; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
