name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Direct APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 웹 에셋 폴더 생성 및 index.html 위치 보장
          mkdir -p android/app/src/main/assets/public
          if [ -f "index.html" ]; then cp index.html android/app/src/main/assets/public/; fi
          
          # 설정 파일 생성
          echo '{"appId": "com.komessenger.app", "appName": "KOMESSENGER", "webDir": "android/app/src/main/assets/public"}' > capacitor.config.json

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMESSENGER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
