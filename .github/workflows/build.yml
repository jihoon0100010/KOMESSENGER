name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare App & Capacitor Config
        run: |
          mkdir -p www
          mv index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId": "com.komessenger.app", "appName": "KOMESSENGER", "webDir": "www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clear Gradle Cache & Build APK
        run: |
          cd android
          rm -rf ~/.gradle/caches/
          chmod +x gradlew
          ./gradlew assembleDebug --refresh-dependencies --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMESSENGER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
